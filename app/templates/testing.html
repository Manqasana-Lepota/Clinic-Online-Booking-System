<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctor Schedule Form</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">
<div class="card-header bg-primary text-white">
<h4 class="mb-0">Doctor Schedule Form</h4>
</div>

<div class="card-body">

<form>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Doctor Name</label>
<input type="text" class="form-control" placeholder="Enter doctor name" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Specialization</label>
<select class="form-select">
<option selected>Select specialization</option>
<option>General Practitioner</option>
<option>Cardiologist</option>
<option>Dentist</option>
<option>Pediatrician</option>
</select>
</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Schedule Date</label>
<input type="date" class="form-control" required>
</div>

<div class="col-md-3 mb-3">
<label class="form-label">Start Time</label>
<input type="time" class="form-control" required>
</div>

<div class="col-md-3 mb-3">
<label class="form-label">End Time</label>
<input type="time" class="form-control" required>
</div>

</div>

<div class="mb-3">
<label class="form-label">Room Number</label>
<input type="text" class="form-control" placeholder="Enter room number">
</div>

<div class="mb-3">
<label class="form-label">Notes</label>
<textarea class="form-control" rows="3" placeholder="Additional notes"></textarea>
</div>

<button type="submit" class="btn btn-success">Save Schedule</button>
<button type="reset" class="btn btn-secondary">Clear</button>

</form>

</div>
</div>

</div>

</body>
</html>
