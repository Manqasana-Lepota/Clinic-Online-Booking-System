<!DOCTYPE html>
<html>
<head>
  <title>Manage Schedule</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/doctor.css">
  <link rel="shortcut icon" href="{{url_for('static', filename='images/clinic-logo.png')}}">
</head>

<body class="container mt-4">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3>🗓️ My Availability</h3>
  <a href="{{ url_for('doctor.DoctorDashboard') }}" class="btn-back">
    ← Back to Dashboard
  </a>
</div>

<!-- Schedule Table Card -->
<div class="card p-3 mb-4">
  <h5 class="section-title">Existing Schedules</h5>

  <div class="table-responsive">
    <table class="table table-hover align-middle text-center">
      <thead>
        <tr>
          <th>Day</th>
          <th>Start</th>
          <th>End</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        {% for s in schedules %}
        <tr>
          <td>{{ s.day }}</td>
          <td>{{ s.start_time }}</td>
          <td>{{ s.end_time }}</td>
          <td>
            <span class="badge {% if s.status == 'Available' %}bg-success{% else %}bg-danger{% endif %}">
              {{ s.status }}
            </span>
          </td>
          <td>
            <a href="{{ url_for('doctor.delete_schedule', schedule_id=s.schedule_id) }}"
               class="btn btn-danger btn-sm">
              Delete
            </a>

            <button class="btn btn-warning btn-sm"
              data-bs-toggle="modal"
              data-bs-target="#editModal{{ s.schedule_id }}">
              Edit
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<!-- Edit Modals -->
{% for s in schedules %}
<div class="modal fade" id="editModal{{ s.schedule_id }}" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <form method="POST" action="{{ url_for('doctor.edit_schedule', schedule_id=s.schedule_id) }}">

        <div class="modal-header">
          <h5 class="modal-title">Edit Schedule</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label class="form-label">Start Time</label>
            <input type="time" name="start_time" class="form-control"
                   value="{{ s.start_time_str }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">End Time</label>
            <input type="time" name="end_time" class="form-control"
                   value="{{ s.end_time_str }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
              <option value="Available" {% if s.status == 'Available' %}selected{% endif %}>Available</option>
              <option value="Not Available" {% if s.status == 'Not Available' %}selected{% endif %}>Not Available</option>
            </select>
          </div>

        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        </div>

      </form>

    </div>
  </div>
</div>
{% endfor %}

<!-- Add Schedule -->
<div class="card p-3">
  <h5 class="section-title">➕ Add Schedule</h5>

  <form method="POST" action="{{ url_for('doctor.doctor_schedule') }}">
    <div class="row g-3">

      <div class="col-md-3">
        <label class="form-label">Day</label>
        <select name="day" class="form-select" required>
          <option>Monday</option>
          <option>Tuesday</option>
          <option>Wednesday</option>
          <option>Thursday</option>
          <option>Friday</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Start Time</label>
        <input type="time" name="start_time" class="form-control" required>
      </div>

      <div class="col-md-3">
        <label class="form-label">End Time</label>
        <input type="time" name="end_time" class="form-control" required>
      </div>

      <div class="col-md-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          <option value="Available">Available</option>
          <option value="Not Available">Not Available</option>
        </select>
      </div>

    </div>

    <div class="mt-3">
      <button class="btn btn-primary w-100">Save Schedule</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
